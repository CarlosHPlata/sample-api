name: validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "checkout code"
        uses: actions/checkout@v5

      - name: "setup node"
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: "Install dependencies"
        run: npm ci

      - name: "run tests"
        run: "npm test"
